<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quarto 3D - Interativo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
      background-color: #1a1a1a;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    /* Interface e Botões Digitais na Tela */
    .controls-overlay {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: grid;
      grid-template-columns: repeat(3, 55px);
      grid-template-rows: repeat(2, 55px);
      gap: 10px;
      z-index: 10;
    }
    .btn {
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 12px;
      color: white;
      font-weight: bold;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
      touch-action: manipulation;
    }
    .btn:active {
      background: rgba(255, 255, 255, 0.6);
    }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }

    /* Painel de Interação */
    .actions-overlay {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .action-btn {
      padding: 12px 18px;
      background: #2b579a;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .info-box {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 10;
    }
  </style>

  <!-- Biblioteca 3D (Three.js + GLTFLoader) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Instruções -->
  <div class="info-box">
    <strong>Controles:</strong><br>
    • Use as setas digitais na tela<br>
    • Ou teclas W, A, S, D no teclado
  </div>

  <!-- Botões de Movimento -->
  <div class="controls-overlay">
    <div class="btn" id="btn-up">▲</div>
    <div class="btn" id="btn-left">◄</div>
    <div class="btn" id="btn-down">▼</div>
    <div class="btn" id="btn-right">►</div>
  </div>

  <!-- Botões de Ação -->
  <div class="actions-overlay">
    <button class="action-btn" onclick="toggleLight()">💡 Ligar / Desligar Luz</button>
    <button class="action-btn" onclick="resetPosition()">🔄 Resetar Posição</button>
  </div>

  <script>
    // --- Configuração Básica da Cena e Câmera ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // --- Iluminação do Quarto ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const roomLight = new THREE.PointLight(0xffeedd, 1.2, 15);
    roomLight.position.set(0, 4, 0);
    roomLight.castShadow = true;
    scene.add(roomLight);

    // --- Móveis e Estrutura do Quarto ---
    // Chão
    const floorGeo = new THREE.PlaneGeometry(10, 10);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.4 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Paredes
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x34495e });
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), wallMat);
    backWall.position.set(0, 2.5, -5);
    backWall.receiveShadow = true;
    scene.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), wallMat);
    leftWall.position.set(-5, 2.5, 0);
    leftWall.rotation.y = Math.PI / 2;
    leftWall.receiveShadow = true;
    scene.add(leftWall);

    // Cama
    const bedGroup = new THREE.Group();
    const bedBase = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 3), new THREE.MeshStandardMaterial({ color: 0x4a2e18 }));
    bedBase.position.set(0, 0.25, 0);
    const mattress = new THREE.Mesh(new THREE.BoxGeometry(2, 0.4, 2.8), new THREE.MeshStandardMaterial({ color: 0xecf0f1 }));
    mattress.position.set(0, 0.6, 0);
    const pillow = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.2, 0.6), new THREE.MeshStandardMaterial({ color: 0x3498db }));
    pillow.position.set(0, 0.8, -1);
    bedGroup.add(bedBase, mattress, pillow);
    bedGroup.position.set(-3.5, 0, -3.2);
    scene.add(bedGroup);

    // Mesa
    const table = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 1), new THREE.MeshStandardMaterial({ color: 0x4a2e18 }));
    table.position.set(-1.8, 0.6, -4.2);
    scene.add(table);

    // --- Carregamento da Personagem 'personagem_feminina.glb' ---
    let player = new THREE.Group();
    scene.add(player);
    player.position.set(0, 0, 0);

    // Nome exato do seu arquivo salvo
    const characterURL = './personagem_feminina.glb'; 

    const loader = new THREE.GLTFLoader();
    loader.load(
      characterURL,
      (gltf) => {
        const model = gltf.scene;
        model.scale.set(1, 1, 1); // Ajusta a escala da personagem
        model.traverse((child) => {
          if (child.isMesh) child.castShadow = true;
        });
        player.add(model);
      },
      undefined,
      (error) => {
        console.warn('Procurando arquivo local...', error);
        // Cubo reserva caso o arquivo não esteja no mesmo diretório
        const placeholder = new THREE.Mesh(
          new THREE.BoxGeometry(0.8, 1.6, 0.8),
          new THREE.MeshStandardMaterial({ color: 0xe74c3c })
        );
        placeholder.position.y = 0.8;
        player.add(placeholder);
      }
    );

    // --- Lógica de Controles e Movimento ---
    const moveState = { up: false, down: false, left: false, right: false };
    const speed = 0.08;

    // Controles por Toque / Mouse
    function bindTouchBtn(id, key) {
      const btn = document.getElementById(id);
      const start = (e) => { e.preventDefault(); moveState[key] = true; };
      const end = (e) => { e.preventDefault(); moveState[key] = false; };
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('touchstart', start);
      btn.addEventListener('touchend', end);
    }

    bindTouchBtn('btn-up', 'up');
    bindTouchBtn('btn-down', 'down');
    bindTouchBtn('btn-left', 'left');
    bindTouchBtn('btn-right', 'right');

    // Teclado
    window.addEventListener('keydown', (e) => {
      if (['w', 'W', 'ArrowUp'].includes(e.key)) moveState.up = true;
      if (['s', 'S', 'ArrowDown'].includes(e.key)) moveState.down = true;
      if (['a', 'A', 'ArrowLeft'].includes(e.key)) moveState.left = true;
      if (['d', 'D', 'ArrowRight'].includes(e.key)) moveState.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (['w', 'W', 'ArrowUp'].includes(e.key)) moveState.up = false;
      if (['s', 'S', 'ArrowDown'].includes(e.key)) moveState.down = false;
      if (['a', 'A', 'ArrowLeft'].includes(e.key)) moveState.left = false;
      if (['d', 'D', 'ArrowRight'].includes(e.key)) moveState.right = false;
    });

    // Funções das Interações
    function toggleLight() {
      roomLight.visible = !roomLight.visible;
    }

    function resetPosition() {
      player.position.set(0, 0, 0);
    }

    // --- Loop de Animação ---
    function animate() {
      requestAnimationFrame(animate);

      if (moveState.up && player.position.z > -4) {
        player.position.z -= speed;
        player.rotation.y = Math.PI;
      }
      if (moveState.down && player.position.z < 4) {
        player.position.z += speed;
        player.rotation.y = 0;
      }
      if (moveState.left && player.position.x > -4) {
        player.position.x -= speed;
        player.rotation.y = -Math.PI / 2;
      }
      if (moveState.right && player.position.x < 4) {
        player.position.x += speed;
        player.rotation.y = Math.PI / 2;
      }

      // Câmera acompanha o jogador
      camera.position.x = player.position.x;
      camera.position.z = player.position.z + 6;
      camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
