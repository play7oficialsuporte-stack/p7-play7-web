<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparador & Lista de Compras | Finanças</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --ml-yellow: #fff159;
      --ml-blue: #2d3277;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2rem;
      color: var(--text);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .search-box input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-box button {
      padding: 12px 24px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-box button:hover {
      background-color: var(--primary-hover);
    }

    .main-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    .section-title {
      font-size: 1.25rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
    }

    .product-img {
      width: 100%;
      height: 150px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .product-title {
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.3;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: #059669;
      margin-bottom: 12px;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-buy {
      display: block;
      text-align: center;
      background-color: var(--ml-yellow);
      color: var(--ml-blue);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .btn-add {
      background: transparent;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-add:hover {
      background-color: var(--bg);
    }

    /* Lista de Compras Lateral */
    .cart-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      position: sticky;
      top: 20px;
    }

    .cart-items {
      list-style: none;
      margin-bottom: 16px;
      max-height: 400px;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item-info {
      max-width: 180px;
    }

    .cart-item-title {
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-price {
      font-size: 0.85rem;
      font-weight: 600;
      color: #059669;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 700;
      padding-top: 12px;
      border-top: 2px solid var(--border);
    }

    .btn-remove {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Economize nas suas Compras</h1>
      <p>Pesquise produtos no Mercado Livre, planeje sua lista de compras e aproveite os melhores preços!</p>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Ex: Livro Pai Rico Pai Pobre, Calculadora HP..." value="Calculadora HP 12C">
      <button onclick="buscarProdutos()">Buscar</button>
    </div>

    <div class="main-layout">
      <!-- Resultados da Busca -->
      <div>
        <h2 class="section-title">Resultados no Mercado Livre</h2>
        <div id="productsGrid" class="products-grid">
          <p style="color: var(--text-muted);">Digite um produto acima e clique em "Buscar"...</p>
        </div>
      </div>

      <!-- Minha Lista de Compras -->
      <div>
        <div class="cart-card">
          <h2 class="section-title">Minha Lista de Compras</h2>
          <ul id="cartItems" class="cart-items">
            <p style="color: var(--text-muted); font-size: 0.9rem;">Sua lista está vazia.</p>
          </ul>
          <div class="cart-total">
            <span>Total Estimado:</span>
            <span id="cartTotal">R$ 0,00</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configuração do seu ID de Afiliado
    const MATT_TOOL = "SUA_TAG_AQUI"; // Insira aqui sua tag/ID de afiliado do ML quando tiver

    let listaDeCompras = [];

    // Função para buscar produtos diretamente na API Pública do Mercado Livre
    async function buscarProdutos() {
      const termo = document.getElementById('searchInput').value;
      const grid = document.getElementById('productsGrid');

      if (!termo) return;

      grid.innerHTML = '<p style="color: var(--text-muted);">Buscando ofertas...</p>';

      try {
        const response = await fetch(`https://api.mercadolibre.com/sites/MLB/search?q=${encodeURIComponent(termo)}&limit=8`);
        const data = await response.json();

        grid.innerHTML = '';

        if (data.results.length === 0) {
          grid.innerHTML = '<p>Nenhum produto encontrado.</p>';
          return;
        }

        data.results.forEach(produto => {
          // Constrói o link do produto aplicando a tag de afiliado
          let linkAfiliado = produto.permalink;
          if (MATT_TOOL && MATT_TOOL !== "SUA_TAG_AQUI") {
            linkAfiliado += `?matt_tool=${MATT_TOOL}`;
          }

          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <div>
              <img class="product-img" src="${produto.thumbnail.replace('I.jpg', 'O.jpg')}" alt="${produto.title}">
              <div class="product-title" title="${produto.title}">${produto.title}</div>
              <div class="product-price">R$ ${produto.price.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</div>
            </div>
            <div class="card-actions">
              <a href="${linkAfiliado}" target="_blank" rel="noopener noreferrer" class="btn-buy">Ver no Mercado Livre</a>
              <button class="btn-add" onclick="adicionarAALista('${produto.id}', '${produto.title.replace(/'/g, "\\'")}', ${produto.price}, '${linkAfiliado}')">
                + Adicionar à Lista
              </button>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (error) {
        console.error("Erro ao buscar produtos:", error);
        grid.innerHTML = '<p style="color: red;">Erro ao carregar os produtos. Tente novamente.</p>';
      }
    }

    // Gerenciamento da Lista de Compras
    function adicionarAALista(id, titulo, preco, link) {
      listaDeCompras.push({ id, titulo, preco, link });
      atualizarListaHTML();
    }

    function removerDaLista(index) {
      listaDeCompras.splice(index, 1);
      atualizarListaHTML();
    }

    function atualizarListaHTML() {
      const cartContainer = document.getElementById('cartItems');
      const totalContainer = document.getElementById('cartTotal');

      if (listaDeCompras.length === 0) {
        cartContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Sua lista está vazia.</p>';
        totalContainer.innerText = 'R$ 0,00';
        return;
      }

      cartContainer.innerHTML = '';
      let total = 0;

      listaDeCompras.forEach((item, index) => {
        total += item.preco;
        const li = document.createElement('li');
        li.className = 'cart-item';
        li.innerHTML = `
          <div class="cart-item-info">
            <div class="cart-item-title">${item.titulo}</div>
            <div class="cart-item-price">R$ ${item.preco.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</div>
          </div>
          <button class="btn-remove" onclick="removerDaLista(${index})">&times;</button>
        `;
        cartContainer.appendChild(li);
      });

      totalContainer.innerText = `R$ ${total.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
    }

    // Realiza uma busca inicial automática ao carregar
    window.onload = buscarProdutos;
  </script>
</body>
</html>
