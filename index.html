<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BACKROOMS</title><link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<canvas id="c"></canvas><div id="fx"></div><div id="vhs"></div>
<div id="hud" class="hide"><div id="obj">OBJETIVO<br><small>Encontre a saída.</small></div><div id="ret"></div><div id="fl">🔦</div></div>
<div id="touch" class="hide"><div id="joy"><i id="knob"></i></div><div id="look"></div><button id="bRun">CORRER</button><button id="bFl">LANTERNA</button></div>
<div id="menu" class="screen"><h1>BACKROOMS</h1><p>ENTRE POR SUA CONTA E RISCO</p>
<button id="bPlay">JOGAR</button><button id="bCfg">CONFIGURAÇÕES</button><div id="err"></div></div>
<div id="cfg" class="screen hide"><h2>CONFIGURAÇÕES</h2>
<label>Volume geral<input id="vM" type="range" min="0" max="1" step=".05" value=".8"></label>
<label>Volume ambiente<input id="vA" type="range" min="0" max="1" step=".05" value=".5"></label>
<label>Volume efeitos<input id="vS" type="range" min="0" max="1" step=".05" value=".8"></label>
<label>Sensibilidade<input id="sens" type="range" min=".3" max="3" step=".1" value="1"></label>
<label>Qualidade<select id="qual"><option value="low">BAIXA</option><option value="mid">MÉDIA</option><option value="high">ALTA</option></select></label>
<button id="bVhs">EFEITO VHS: ON</button><button id="bBack">VOLTAR</button></div>
<div id="load" class="screen hide"><h2>CARREGANDO...</h2><div class="bar"><b id="prog"></b></div><button id="bEnter" class="hide">ENTRAR</button></div>
<div id="end" class="screen hide"><h2 id="endTxt"></h2><button id="bAgain" class="hide">JOGAR NOVAMENTE</button></div>
<script type="module" src="game.js"></script></body></html>
